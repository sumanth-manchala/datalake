[workspace]
authors = ["sumanth-manchala <manchala.msr@gmail.com>"]
channels = ["conda-forge"]
name = "datalake"
platforms = ["osx-arm64"]
version = "0.1.0"

[activation.env]
# bundled postgres cluster (server and all client tools read these)
PGDATA = "$PIXI_PROJECT_ROOT/.pgdata"
PGHOST = "localhost"
PGPORT = "5433"
PGUSER = "lakehouse_pg_user"
PGPASSWORD = "lakehouse_pg_password"
# airflow
AIRFLOW_HOME = "$PIXI_PROJECT_ROOT/orchestration/airflow_home"
AIRFLOW__DATABASE__SQL_ALCHEMY_CONN = "postgresql+psycopg2://lakehouse_pg_user:lakehouse_pg_password@localhost:5433/airflow"
AIRFLOW__CORE__EXECUTOR = "LocalExecutor"
AIRFLOW__CORE__DAGS_FOLDER = "$PIXI_PROJECT_ROOT/orchestration/src/dags"
AIRFLOW__CORE__PLUGINS_FOLDER = "$PIXI_PROJECT_ROOT/orchestration/src/plugins"
AIRFLOW__CORE__LOAD_EXAMPLES = "False"

[tasks]
lint = "ruff check ."
format = "ruff format ."
typecheck = "ty check orchestration api sdk"
test = "pytest orchestration && pytest api && pytest sdk"
db-init = "bash scripts/init_db.sh"
db-start = "pg_ctl status || pg_ctl -l $PGDATA/postgres.log start"
db-stop = "pg_ctl stop"
s3-start = "bash scripts/init_s3.sh"
# SIGKILL: seaweedfs ignores TERM/INT; fine for a local dev store (crash-tolerant format)
s3-stop = "bash -c 'kill -9 $(cat .s3data/*.pid) 2> /dev/null; rm -f .s3data/*.pid; true'"
api-start = { cmd = "uvicorn --app-dir api/src lakehouse_api.app:app --port 8000", depends-on = ["db-start"] }
start = { cmd = "airflow standalone", depends-on = ["db-start"] }
api-openapi = "python -c 'import json, sys; sys.path.insert(0, \"api/src\"); from lakehouse_api.app import app; json.dump(app.openapi(), open(\"ui/openapi.json\", \"w\"), indent=2)'"
ui-install = "pnpm -C ui install"
ui-codegen = { cmd = "pnpm -C ui codegen", depends-on = ["api-openapi"] }
ui-dev = "pnpm -C ui dev"
ui-test = "pnpm -C ui test"

[dependencies]
python = "3.12.*"
ruff = "*"
ty = "*"
apache-airflow = "3.3.0.*"
apache-airflow-providers-postgres = "*"
psycopg2 = "*"
asyncpg = ">=0.31.0,<0.32"
postgresql = ">=18.4,<19"
pytest = ">=9.1.1,<10"
pyiceberg = ">=0.11.1,<0.12"
pyarrow = ">=25.0.0,<26"
python-duckdb = ">=1.5.5,<2"
fastapi = ">=0.136.3,<0.137"
uvicorn = ">=0.52.1,<0.53"
httpx = ">=0.28.1,<0.29"
s3fs = ">=2026.6.0,<2027"
seaweedfs = ">=4.40,<5"
rustfs = ">=1.0.0beta.12,<2"
pandas = ">=3.0.5,<4"
nodejs = "24.*"
pnpm = ">=12.4.1,<13"
